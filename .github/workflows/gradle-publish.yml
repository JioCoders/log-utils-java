name: Publish to Maven Central

on:
  release:
    types: [published] # Triggers automatically when you create a GitHub Release
  workflow_dispatch: # Adds a manual "Run workflow" button in the GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build and Publish to Central Portal
        working-directory: oracle-buffered-logger # Tells GitHub to enter your project subfolder first
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew clean publishMavenPublicationToCentralPortal --no-daemon
