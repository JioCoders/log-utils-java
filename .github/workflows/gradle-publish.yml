# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Publish to Maven Central

on:
  release:
    types: [published] # Triggers automatically when you create a GitHub Release
  workflow_dispatch: # Adds a manual "Run workflow" button in the GitHub UI

jobs:
  # JOB 1: Deploys your module safely to the GitHub Packages ecosystem
  publish-to-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Critical permission required to authenticate and write to GPR

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        env:
          # Maps GitHub context variables right into your System.getenv() variables
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub
        run: |
          cd oracle-buffered-logger
          ../gradlew publishMavenPublicationToGitHubPackagesRepository --no-daemon

  # JOB 2: Deploys your module securely to Maven Central using your Ed25519 GPG configuration
  publish-to-maven-central:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Debug Project Structure
        run: |
          echo "=== Root Directory Content ==="
          ls -R

      - name: Build and Publish to Central Portal
        env:
          # Native environment injection strings mapping your Repository Secrets
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          cd oracle-buffered-logger
          ../gradlew clean publishMavenPublicationToCentralPortal --no-daemon
