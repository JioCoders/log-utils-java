# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: CI/CD - Build, Package and Publish Java Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published] # Triggers publishing instantly when a GitHub Release is created
  workflow_dispatch: # Adds a manual "Run workflow" button in the GitHub UI

jobs:
  # ==========================================
  # JOB 1: VERIFICATION (Runs on PRs & Commits)
  # Verification (Runs on every Commit, Branch Push, and PR)
  # ==========================================
  verify:
    name: Verify and Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache and Run Verification
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit # Feeds real-time dependency health to Dependabot

      - name: Execute Tests & Code Validation
        run: ./gradlew clean check --no-daemon

  # ==========================================
  # JOB 2: GITHUB PACKAGES PUBLISHING
  # Publishing (Runs ONLY when you explicitly publish a GitHub Release)
  # ==========================================
  publish-github-packages:
    name: Publish to GitHub Packages
    needs: verify
    # 👇 Updated: Runs if it's a real release OR if you trigger it manually
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Grants secure write permission to attach binary jars into Release pages
      packages: write    # Grants secure write permission to authenticate and write to GPR, deploy onto GitHub Packages

    steps:
      - name: Checkout Production Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle Deployment Engine
        uses: gradle/actions/setup-gradle@v4

      - name: Build, Sign, and Publish to GitHub Packages
        env:
          # Native environment injection strings mapping your Repository Secrets
          # In-memory GPG credentials required by your signing { } block
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Local target fallback credentials for GitHub Packages repository block
          # Maps GitHub context variables right into your System.getenv() variables
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub
        # Explicit target execution handling avoiding path breaks
        run: |
          cd oracle-buffered-logger
          # 1. Publishes signed Maven POMs and elements locally to GitHub Packages
          # 2. Uses your nmcp plugin to zip up elements and transport them securely to Sonatype Central Portal
          ../gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon

      - name: Attach Packaged Jars to GitHub Release UI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Finds all compiled libraries inside your project subfolders and attaches them to the Release interface
          echo "Uploading compiled jars to Github Release asset manager..."
          for file in $(find . -path "**/build/libs/*.jar" ! -name "*plain*"); do
            echo "Uploading asset: $file"
            gh release upload ${{ github.event.release.tag_name }} "$file" --clobber
          done

  # ==========================================
  # JOB 3: MAVEN CENTRAL PUBLISHING
  # Deploys your module securely to Maven Central using your Ed25519 GPG configuration
  # ==========================================
  publish-to-maven-central:
    name: Publish to Maven Central
    needs: publish-github-packages
    # 👇 Updated: Runs if it's a real release OR if you trigger it manually
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Debug Project Structure
        run: |
          echo "=== Root Directory Content ==="
          ls -R

      - name: Bundle, Sign and Publish to Central Portal via NMCP
        env:
          # Native environment injection strings mapping your Repository Secrets
          # In-memory GPG credentials required by your signing { } block
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Sonatype credentials for your nmcp { } block
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        # Explicit target execution handling avoiding path breaks
        run: |
          cd oracle-buffered-logger
          # Explicitly targets the NMCP task block to zip and upload straight to Sonatype Portal
          # ../gradlew clean publishMavenPublicationToCentralPortal --no-daemon
           ../gradlew clean publishAllPublicationsToMavenRepository --no-daemon

  test-job:
    name: OK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Checkout Source Code
        run: |
          cd oracle-buffered-logger
          # Explicitly targets the NMCP task block to zip and upload straight to Sonatype Portal
          ../gradlew clean |
          ../gradlew build |
          ../gradlew test