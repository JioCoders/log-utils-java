plugins {
    id 'java'
    id 'org.springframework.boot' version "${spring_version}"
    id 'io.spring.dependency-management' version "${dependency_plugin}"
}

group = "${group_name}"
version = "${version_name}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}
subprojects {
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${spring_version}"
        }
    }
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${spring_version}")

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation project(':oracle-buffered-logger')

    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${swagger}"
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot  {
    buildInfo()
}

bootJar {
    enabled = true
}
