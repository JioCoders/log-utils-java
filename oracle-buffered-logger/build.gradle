//https://docs.gradle.org/current/userguide/publishing_maven.html
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    // Use the official community-standard plugin recommended by Sonatype
    id 'com.gradleup.nmcp' version '0.0.9'
    id 'io.freefair.lombok' version '8.6'
}

group = "${group_name}"
version = "${version_name}"
ext {
    sdkName = "${app_name}"
}
repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-envers'

    // Test
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = "${group_name}"
            artifactId = "${artifact_id}"
            version = "${version_name}"

            from components.java

            versionMapping {
                usage("java-api") { fromResolutionResult() }
                usage("java-runtime") { fromResolutionResult() }
            }

            pom {
                name = 'Oracle Buffered Logger'
                description = 'A buffered logging utility for Oracle database with Spring Boot integration'
                url = 'https://github.com/JioCoders/log-utils-java'
                inceptionYear = "2026"

                organization {
                    name = "JioCoders"
                    url = "https://jiocoders.com/"
                }
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = 'jiocoders'
                        name = 'JioCoders'
                        email = 'jiocoders@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/JioCoders/log-utils-java'
                    developerConnection = 'scm:git:ssh://github.com/JioCoders/log-utils-java'
                    url = 'https://github.com/JioCoders/log-utils-java'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/JioCoders/log-utils-java')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_USERNAME')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

// 1. Ensure signing is explicitly linked to your publication
// Enable signing for the mavenJava publication
signing {
    def signingKeyRaw = System.getenv("GPG_SIGNING_KEY") ?: ""
    def signingPassword = System.getenv("GPG_PASSPHRASE") ?: ""
    boolean isJitPack = System.getenv("JITPACK") == "true"
    if (!isJitPack && !signingKeyRaw.isEmpty()) {
        String signingKey = signingKeyRaw.contains("-----BEGIN") ? signingKeyRaw : new String(Base64.getDecoder().decode(signingKeyRaw.trim()))
        // Use in-memory key decoding for GitHub Actions
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    } else if (!isJitPack) {
        // Fallback to your local Mac setup for manual builds
        useGpgCmd()
        sign publishing.publications.maven
    } else {
        // Skip execution cleanly on JitPack nodes to avoid build crashes
        project.logger.lifecycle("JitPack environment detected: Skipping GPG Signing.")
    }
}
// 2. Configure NMCP to fetch the signed artifacts
// Configure the Sonatype Central modern publishing block
nmcp {
    publish('maven') {
        // 2. Read from system environment variables in CI, fallback to gradle.properties locally
        username = System.getenv("OSSRH_USERNAME") ?: providers.gradleProperty("ossrhUsername").getOrNull()
        password = System.getenv("OSSRH_PASSWORD") ?: providers.gradleProperty("ossrhPassword").getOrNull()
    }
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

jar {
    enabled = true
}

// 3. CRITICAL: Force Gradle to sign the artifacts before NMCP creates the zip bundle
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn tasks.withType(Sign)
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.failOnError = false
}

tasks.matching { it.name.startsWith("publish") && it.name.contains("PublicationTo") }.configureEach {
    mustRunAfter tasks.withType(Sign)
}
